<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incredibuild — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: #8b8fa8;
      margin-bottom: 32px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 12px;
      color: #8b8fa8;
      margin-bottom: 6px;
    }

    input[type="email"] {
      width: 100%;
      background: #252836;
      border: 1px solid #3a3d50;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    input[type="email"]:focus { border-color: #29b5e8; }

    button {
      width: 100%;
      padding: 10px;
      background: #29b5e8;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #1fa3d4; }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #8b8fa8;
      text-align: center;
    }

    .error {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(255, 80, 80, 0.12);
      border: 1px solid rgba(255, 80, 80, 0.3);
      border-radius: 6px;
      font-size: 13px;
      color: #ff8080;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Incredibuild</div>
    <div class="subtitle">Free Trial Dashboard</div>

    <form method="POST" action="/login">
      <label for="username">Snowflake username (email)</label>
      <input type="email" id="username" name="username"
             placeholder="you@incredibuild.com" autofocus required />
      <button type="submit">Sign in with SSO</button>
    </form>

    <p class="hint">A browser tab will open for Snowflake SSO authentication.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
