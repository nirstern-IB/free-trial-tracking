[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "free-trial-tracking"
version = "0.1.0"
description = "Flask dashboard for free trial build activity"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["app", "snowflake_connection"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
